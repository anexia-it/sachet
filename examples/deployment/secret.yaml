apiVersion: v1
kind: Secret
metadata:
  name: sachet-config
  labels:
    app.kubernetes.io/name: sachet
    app.kubernetes.io/part-of: alerting
type: Opaque
stringData:
  config.yaml: |
    providers:
      anexia:
        api_key: "ANEXIA_API_KEY"
        encoding: "GSM"
        sender: "MySender"
        delivery_report: true

    receivers:
      - name: "team-sms"
        provider: "anexia"
        to:
          - "+4366412345"
        from: "MySender"
        text: "{{ .CommonLabels.alertname }}: {{ .Status | toUpper }}"

    templates: []

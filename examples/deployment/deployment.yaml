apiVersion: apps/v1
kind: Deployment
metadata:
  name: sachet
  labels:
    app.kubernetes.io/name: sachet
    app.kubernetes.io/part-of: alerting
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sachet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sachet
    spec:
      containers:
        - name: sachet
          image: ghcr.io/messagebird/sachet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9876
          args:
            - -config
            - /etc/sachet/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/sachet
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          secret:
            secretName: sachet-config
